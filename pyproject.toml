[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-splitter-auditor"
version = "1.0.0"
description = "Outil MCP Interne #10 : Auditeur de poids de code et générateur de plans de découpage modulaire"
authors = [{ name = "Snorbik AI Engineering Team" }]
dependencies = [
    "pydantic>=2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
cache_dir = ".pytest_cache"
