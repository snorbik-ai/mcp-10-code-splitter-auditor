[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-10-code-splitter-auditor"
version = "0.1.3"
description = "Auditeur de budget de lignes et générateur de plans de découpage modulaires pour serveurs MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Snorbik AI Engineering", email = "engineering@snorbik.ai" }
]
dependencies = [
    "pydantic>=2.7.0",
    "mcp>=1.0.0"
]

[tool.setuptools]
packages = ["core", "canal_mcp", "canal_sdk_cli"]

[project.scripts]
splitter-cli = "canal_sdk_cli.cli:main"
